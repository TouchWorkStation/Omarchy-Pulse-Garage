# Omarchy Pulse: what your wallpaper shows. Save this file and the wallpaper picks it up in a few seconds.
# Every [[source]] below becomes a panel. Any data you can get from a command, a URL, a file, a stream or a
# camera can live on your desktop; your own scripts go in ~/.config/omarchy-pulse/sources/ (it is on their PATH).
# (c) 2026 Marco Porro (x.com/MarcoPorro), MIT.

[pulse]
city = ""                        # weather: "Milan", "Berlin"... (or latitude = 45.46 / longitude = 9.19)
units = "metric"                 # or "imperial"
clock = "24h"                    # or "12h"
scene = "sphere"                 # sphere (the LED sphere) | skyline | orbit | calm | garage (or: omarchy-pulse scene garage)
skyline = "auto"                 # the real city behind the towers: "auto" (the weather's city), "off", or one of
                                 # 90+ cities: rome, milan, alessandria, new-york, tokyo, paris... (docs/GUIDE.md 22)
sphere = "real"                  # the sphere's look: "real" (one continuous image) | "led" (thousands of separate lights)
fps = 20                         # on an empty desktop; it slows down by itself under windows and stops when
                                 # something is full screen
quality = "auto"                 # how sharp the scene is: "full" (your screen's resolution, sharper, heavier),
                                 # "half" (lighter), "auto" (full; half above 2560x1440, on battery or when slow)
pause_when_covered = true        # pause drawing on monitors almost fully covered by windows
privacy_on_screenshare = true    # sharing or recording the screen hides cameras, notifications and private panels
temp_crit = 90                   # °C: CPU temperature alert
gpu = "auto"                     # "never" if the wallpaper is heavy on a PC without a working GPU driver
dmabuf = "auto"                  # NVIDIA: "auto" keeps WebKit's DMA-BUF renderer off (some drivers draw nothing with
                                 # it); "on" is much lighter on recent drivers, above all with 4K or several monitors
face = "agents"                  # the agent's face in the core: "agents" (while one works) | "always" | "off"
banner = "OMARCHY · WE CAN FIX EVERYTHING"   # a plane tows it across the sky now and then ("" = never)
banner_every = 45                # minutes, more or less; a new Omarchy release flies by itself
agents_as = "drones"             # your AI agents (Claude Code, Codex, Grok, Hermes...): "drones" in the sky | "robots" on the floor | "both"
celebrate = true                 # fireworks when an agent finishes, a focus ends or an alert is back to green
sun = true                       # the sky follows the real sun (dawn, day, dusk, night)
# title = "MISSION CONTROL"      # a word under the clock
# font = "CaskaydiaMono Nerd Font"
# port = 47800

[colors]
preset = "theme"                 # theme (the Omarchy theme in use) | synthwave | matrix | amber | ice | vapor | inferno
# accent = "#39e1ff"             # or set any single colour: bg, fg, accent, accent2, ok, warn, crit, dim

[music]
enabled = "auto"                 # the city dances while music plays (needs cava): "auto" | "always" | "off"
input = "pulse"                  # cava's input: "pulse" (PipeWire too) or "pipewire"

[presence]
eyes = true                      # the face's eyes follow your pointer; moving it on an empty desktop wakes the face
lock = true                      # locking the screen (or the screensaver) = you are away: the face sleeps
digest_after = 2                 # minutes away before "while you were away" shows what you missed
notify = true                    # the digest also as a desktop notification
# hypridle can tell Pulse too: on-timeout = omarchy-pulse away / on-resume = omarchy-pulse back

[lan]
enabled = true                   # every device on your network is a car on the grid; a new one is an alert
cars = true
scan = "auto"                    # with fping installed, look for every device every 5 minutes ("off": only those
                                 # your PC already talks to). The first 10 minutes on a network are learnt, no alerts.
alert_new = true
# names = { "192.168.1.5" = "nas", "aa:bb:cc:dd:ee:ff" = "tv" }   # by IP or MAC; else the name your router gives

[voice]
enabled = false                  # Pulse speaks: alerts, agents that finish or need you, the digest, the end of a focus
events = ["alerts", "agents", "digest", "focus", "space", "calendar", "home", "earth", "car"]
language = "en"                  # what Pulse says by itself: en, it, es, fr, de (and the voice of that language)
# speakers = ["notify.alexa_media_echo_kitchen"]   # Alexa (Alexa Media Player) or media_player.* says it too, via [home]
quiet = "23:00-08:00"            # never at night ("" = always). Never while sharing the screen, away or in focus.
# model = "~/.local/share/piper/en_US-lessac-medium.onnx"   # piper-tts voice, American English (default: the first
                                 # .onnx in that folder); en_GB-alan-medium for British, it_IT-paola-medium for Italian
# espeak_voice = "en-us"         # espeak-ng: American English by default ("en-gb", "it"...)
# command = "spd-say -e"         # or any command that reads the text on stdin

[git]
root = "auto"                    # your repositories are towers (~/code, ~/src, ~/projects... or a folder of yours)
# repos = ["~/code/omarchytv", "~/code/omarchy-pulse-theme"]   # or exactly these
ci = "auto"                      # the beacon on top: GitHub Actions of the branch (needs `gh auth login`)
max = 8

[garage]                         # scene = "garage": your PC as a car in a workshop (docs/GARAGE.md)
brand = "Omarchy Pulse"          # the name at the top left (your project, your studio...)
tagline = "REPOSITORIES · AGENTS · BUILDS · PULSE"
link = ""                        # bottom left, e.g. "github.com/you" ("" = hidden)
plate = ""                       # the picture: your own render or photo (jpg/png/webp); plate.json beside it says
                                 # where its headlights, floor and window are. "" = the one in web/garage/, if any
fuel_goal = 60                   # a full tank, in points a week: 1 a commit, +1 when it is pushed, 3 a branch you worked on
cpu = 85                         # % for the dashboard lights (they go off again 5% below)
gpu = 90
ram = 85
vram = 90
disk = 90
wait_red = 10                    # minutes an agent can wait for you before its light turns red
layout = "full"                  # "full" | "minimal" (the bar, the lights and the strip: no side panels)
motion = "full"                  # "full" | "reduced" (fewer frames, no breathing) | "off" (a still picture)

[space]
enabled = true                   # the ISS when it passes over your city, a real aurora in a geomagnetic storm,
iss = true                       # solar flares (wheretheiss.at, NOAA SWPC)
launches = "spacex"              # rocket launches, Starlink included: countdown, then liftoff on your horizon
                                 # ("all", "rocketlab", "blueorigin", "nasa", "off")

[heart]
# the horizon beats with your heart. Any source that prints your heart rate, for example Home Assistant:
# url = "http://homeassistant.local:8123/api/states/sensor.watch_heart_rate"
# headers = { Authorization = "Bearer YOUR_TOKEN" }
# command = "cat /tmp/heart"     # or a command, or file = "..."
# every = 10

[crew]
# code = ""                      # omarchy-pulse crew new: your friends' agents fly in your city, yours in theirs
# name = "marco"
# share = "agent"                # "agent" (claude, codex...) or "full" (with the project folder)
# relay = "https://ntfy.sh"      # or your own ntfy server

[listen]
# "hey sphere": bind = SUPER, A, exec, omarchy-pulse listen   (whisper.cpp or faster-whisper, offline)
language = "auto"                # or "en", "it"...
# model = "~/.local/share/whisper/ggml-base.bin"
# ask = "claude -p"              # questions it does not know go to this AI (the question only, no recording)

[city]
enabled = true                   # every focus you finish (10 minutes or more) builds a building in your district;
min_minutes = 10                 # a streak of days keeps its lights on, every 7 days in a row a monument

[sky]
enabled = true                   # the real planes over your city (the weather's city), with their lights
source = "adsb.lol"              # "adsb.lol" (free), "opensky", or your own receiver: "http://localhost:8080/data/aircraft.json"
radius = 25                      # nautical miles around you
routes = true                    # where each flight comes from and goes (adsbdb.com, only the flight code is sent)

[timelapse]
enabled = true                   # your day as a video at midnight (~/Videos/omarchy-pulse), the scene alone: no panels,
every = 90                       # no names; a picture every 90 s while you see it: about 30 s of video (needs ffmpeg)

[calendar]
# ics = ["https://calendar.google.com/calendar/ical/.../basic.ics"]   # your secret iCal address(es), or a file
# command = "my-events-as-json"  # or a command printing [{"title": "...", "start": "2026-11-07T09:30:00+01:00"}]
warn = 5                         # minutes before: the train comes in and the voice tells you
hours = 3                        # how far ahead the trains come from
privacy = true                   # privacy mode while a meeting runs (you may share your screen)
summary_at = "18:00"             # the day's summary: "today: 4 meetings · 3 h 20 min" ("" = never)

[home]
# url = "http://homeassistant.local:8123"
# token = "a long-lived access token"   # Home Assistant: your profile, Security
# doorbell = "binary_sensor.doorbell"   # or an event entity: the sphere becomes the door camera
# camera = "camera.front_door"
# lights = ["light.living_room", "light.kitchen"]   # a panel: click one to switch it
chime = true                     # the doorbell rings on your speakers too (ding-dong)

[car]
enabled = false                  # your electric car parked in the city: battery, charging, a panel to control it
source = "tessie"                # "tessie" (a Tesla through Tessie) or "homeassistant" (any car Home Assistant knows)
# token = "your Tessie API token"   # Tessie: Settings, API Access (or token_file = "~/.config/omarchy-pulse/tessie")
# vin = ""                         # with more cars: which one (the first active one if empty)
# name = "car"                     # what Pulse calls it
every = 60                       # seconds; Tessie's last state, so Pulse never wakes the car
low = 30                         # in the evening (evening = "21:00"), below this and not plugged in: a reminder
allow_unlock = false             # unlocking from the wallpaper stays off unless you turn it on
# with source = "homeassistant", the entities (the Tesla Fleet, Teslemetry or your car's integration):
# battery = "sensor.car_battery"
# range = "sensor.car_range"
# charging = "binary_sensor.car_charging"
# plugged = "binary_sensor.car_charge_cable"
# limit = "number.car_charge_limit"
# lock = "lock.car_doors"
# climate = "climate.car_climate"
# inside = "sensor.car_inside_temperature"
# charge_switch = "switch.car_charge"

[night]
enabled = true                   # the real night sky over you: the Moon (its real phase), Venus, Mars, Jupiter, Saturn,
                                 # the bright stars and their constellations, and more shooting stars in a meteor shower

[starlink]
enabled = true                   # the Starlink trains of the last launches when they really pass over you (CelesTrak)
warn = 5                         # minutes before: on the wallpaper and aloud (0 = no warning)

[storms]
enabled = true                   # thunderstorms from where they really are (8 points 30 km around you, Open-Meteo)
km = 30

[air]
enabled = true                   # air quality and pollen (Open-Meteo): haze when the air is poor, pollen in the light

[sound]
enabled = false                  # a quiet soundscape: the real rain and wind, a plane over you, thunder, the station
volume = 0.25                    # 0..1; silent in a meeting, in the quiet hours, while sharing the screen or full screen
quiet = "23:00-08:00"

[lights]
enabled = false                  # the lights of your room follow Pulse: lightning, alerts, the doorbell, a quake, focus
source = "homeassistant"         # "homeassistant" (any light, Ambilight too, with [home] url and token) or "hue"
# lights = ["light.living_room"] # Home Assistant entities, or Hue light numbers ["1", "3"] (omarchy-pulse lights pair)
# bridge = "192.168.1.20"        # Hue: written by omarchy-pulse lights pair
# user = ""
only_if_on = true                # only the lights that are on (Pulse never wakes a dark room)
focus = true                     # a calm blue while you focus

[robots]
enabled = true                   # your Docker/Podman containers (and AI bots: omarchy-pulse robot) walk on the floor
source = "auto"                  # "docker", "podman" or "auto"

[phone]
enabled = false                  # the moments that matter on your phone (the ntfy app): omarchy-pulse phone new
# topic = "pulse-..."            # keep it secret
details = true                   # false: no meeting titles, focus names or alert texts on the phone

[wrapped]
enabled = true                   # on 31 December, your year as a video (omarchy-pulse wrapped)

[quakes]
enabled = true                   # earthquakes (USGS): the city shakes, a wave comes from where it happened
min_world = 6                    # anywhere in the world from this magnitude
min_near = 3                     # near you (near_km) from this one; 4 and more near you is an alert
near_km = 500
tsunami_km = 1500                # a tsunami message (USGS/NOAA) closer than this is a red alert; any one is shown

[builtin]
system = true
network = true
weather = true
media = true                     # now playing (playerctl)
notifications = true             # the last desktop notifications (Omarchy 4.5 or mako); private
notifications_hours = 3          # only the notifications of the last hours (0 = all of them)
notifications_quick = 120        # Omarchy's own feedback ("layout set to tiling", volume...) leaves after these seconds
# notifications_quick_apps = ["omarchy-action", "omarchy"]
github = ["basecamp/omarchy"]    # repos to follow: latest release and commits ([] to hide)
github_notifications = true      # your GitHub notifications, when `gh auth login` is done

# ---------------------------------------------------------------- your sources
# Common keys: name (unique), title, slot = left|right|center|ticker|auto, order, every (seconds), timeout,
# type = auto|stat|gauge|list|status|text|kv|chart|image, private = true (hidden while sharing the screen),
# icon (a Nerd Font glyph), notify = true (also a desktop notification on alerts),
# warn_above / crit_above / warn_below / crit_below (numbers: the panel turns amber/red and INCOMING plays).

[[source]]
name = "services"
title = "systemd"
icon = "󰒓"
command = "pulse-systemd"        # failed system and user units (ships with Pulse)
every = 60
type = "status"
slot = "right"

[[source]]
name = "news"
title = "omarchy · news"
icon = "󰎕"
command = "pulse-feed 'Omarchy=https://github.com/basecamp/omarchy/releases.atom' 'DHH=https://world.hey.com/dhh/feed.atom'"
every = 1800
slot = "right"
# click = "xdg-open https://world.hey.com/dhh"   # any panel can run a command when you click it

[[source]]
name = "ping"
title = "network"
icon = "󰛳"
command = "pulse-ping gateway 1.1.1.1 github.com"   # 'gateway' = your router
every = 20
type = "status"
slot = "right"

